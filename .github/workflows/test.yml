name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show toolchain
        run: moon version --all

      - name: Format check
        run: moon fmt --check

      - name: Static check
        run: moon check --target all --deny-warn

      - name: Public API info
        run: |
          moon info
          git diff --exit-code

      - name: Tests
        run: moon test --target all --deny-warn

      - name: Build wasm-gc
        run: moon build --target wasm-gc

      - name: Run CLI example
        run: moon run cmd/main

  native:
    name: Native checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Native check and test
        run: |
          moon version --all
          moon check --target native --deny-warn
          moon test --target native --deny-warn
